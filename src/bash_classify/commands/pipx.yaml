# $schema: ../../../schemas/command.schema.json
command: pipx
description: "Install and run Python CLI tools in isolation"
# An unrecognised subcommand is one this file does not model. pipx installs and runs
# CLI tools from PyPI, so an unknown subcommand cannot be read as read-only.
classification: UNKNOWN
strict: false
global_options:
  -h: {overrides: READONLY}
  --version: {overrides: READONLY, before_subcommand_only: true}
  --help: {overrides: READONLY}
subcommands:
  install:
    classification: LOCAL_EFFECTS
    risk: LOW
    strict: false
  uninstall:
    classification: LOCAL_EFFECTS
    risk: LOW
    strict: false
  upgrade:
    classification: LOCAL_EFFECTS
    strict: false
  inject:
    classification: LOCAL_EFFECTS
    strict: false
  run:
    classification: DANGEROUS
    strict: false
    delegates_to:
      mode: rest_are_argv
  list:
    classification: READONLY
    strict: false
  environment:
    classification: READONLY
  ensurepath:
    classification: LOCAL_EFFECTS

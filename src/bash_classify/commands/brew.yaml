# $schema: ../../../schemas/command.schema.json
command: brew
description: "macOS and Linux package manager"
# An unrecognised subcommand is one this file does not model — an external command
# (`brew-<word>` on PATH) or a tap's own. brew installs system packages, so an
# unknown subcommand cannot be read as read-only.
classification: UNKNOWN
strict: false
global_options:
  -h: {overrides: READONLY}
  --version: {overrides: READONLY, before_subcommand_only: true}
  --help: {overrides: READONLY}
subcommands:
  help:
    classification: READONLY
    strict: false
  list:
    classification: READONLY
  info:
    classification: READONLY
  search:
    classification: READONLY
  install:
    classification: LOCAL_EFFECTS
    risk: LOW
  uninstall:
    classification: LOCAL_EFFECTS
    risk: LOW
  update:
    classification: LOCAL_EFFECTS
    risk: LOW
  upgrade:
    classification: LOCAL_EFFECTS
  cleanup:
    classification: LOCAL_EFFECTS
    risk: LOW
  doctor:
    classification: READONLY
  config:
    classification: READONLY

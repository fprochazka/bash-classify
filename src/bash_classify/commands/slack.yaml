# $schema: ../../../schemas/command.schema.json
command: slack
description: "Slack CLI (https://github.com/fprochazka/slackcli) — interact with Slack workspaces"
# An unrecognised subcommand is one this file does not model; the tool posts, edits and
# deletes messages, so an unknown one cannot be read as read-only.
classification: UNKNOWN
strict: false
global_options:
  --help: {overrides: READONLY}
  -o: {takes_value: true}
  --org: {takes_value: true, aliases: [-o]}
  -c: {takes_value: true}
  --config: {takes_value: true, aliases: [-c]}
  -v: {}
  --verbose: {}

subcommands:
  # ── Resolve ───────────────────────────────────────────────────────
  resolve:
    classification: READONLY
    strict: false

  # ── Config ────────────────────────────────────────────────────────
  config:
    classification: READONLY
    strict: false

  # ── Conversations ─────────────────────────────────────────────────
  conversations:
    classification: UNKNOWN
    subcommands:
      list:
        classification: READONLY
        strict: false

  # ── Messages ──────────────────────────────────────────────────────
  messages:
    classification: UNKNOWN
    subcommands:
      list:
        classification: READONLY
        strict: false
      send:
        classification: EXTERNAL_EFFECTS
        strict: false
      edit:
        classification: EXTERNAL_EFFECTS
        strict: false
      delete:
        classification: DANGEROUS
        strict: false

  # ── Reactions ─────────────────────────────────────────────────────
  reactions:
    classification: UNKNOWN
    subcommands:
      add:
        classification: EXTERNAL_EFFECTS
        strict: false
      remove:
        classification: EXTERNAL_EFFECTS
        strict: false

  # ── Pins ──────────────────────────────────────────────────────────
  pins:
    classification: UNKNOWN
    subcommands:
      list:
        classification: READONLY
        strict: false
      add:
        classification: EXTERNAL_EFFECTS
        strict: false
      remove:
        classification: EXTERNAL_EFFECTS
        strict: false

  # ── Scheduled ─────────────────────────────────────────────────────
  scheduled:
    classification: UNKNOWN
    subcommands:
      list:
        classification: READONLY
        strict: false
      create:
        classification: EXTERNAL_EFFECTS
        strict: false
      delete:
        classification: DANGEROUS
        strict: false

  # ── Search ────────────────────────────────────────────────────────
  search:
    subcommands:
      messages:
        classification: READONLY
        strict: false
      files:
        classification: READONLY
        strict: false

  # ── Users ─────────────────────────────────────────────────────────
  # No base: `get`, `list` and `search` are all reads and an unmodelled sibling would be one
  # too. Revisit the day this group grows a write -- the rule is in classification-guidance.md.
  users:
    subcommands:
      list:
        classification: READONLY
        strict: false
      search:
        classification: READONLY
        strict: false
      get:
        classification: READONLY
        strict: false

  # ── Files ─────────────────────────────────────────────────────────
  files:
    classification: UNKNOWN
    subcommands:
      download:
        classification: LOCAL_EFFECTS
        risk: LOW
        strict: false

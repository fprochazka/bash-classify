# $schema: ../../../schemas/command.schema.json
command: go
description: "Tool for managing Go source code"
# An unrecognised subcommand is one this file does not model. `go` builds, downloads
# modules and runs code, so an unknown subcommand cannot be read as read-only.
classification: UNKNOWN
strict: false
global_options:
  --help: {overrides: READONLY}
  -h: {overrides: READONLY, aliases: [--help]}
subcommands:
  help:
    classification: READONLY
    strict: false
  build:
    classification: LOCAL_EFFECTS
    risk: LOW
  test:
    classification: LOCAL_EFFECTS
    risk: LOW
  run:
    classification: DANGEROUS
  install:
    classification: LOCAL_EFFECTS
    risk: LOW
  get:
    classification: LOCAL_EFFECTS
  mod:
    classification: LOCAL_EFFECTS
    subcommands:
      tidy:
        classification: LOCAL_EFFECTS
      download:
        classification: LOCAL_EFFECTS
      verify:
        classification: READONLY
      graph:
        classification: READONLY
  fmt:
    classification: LOCAL_EFFECTS
    risk: LOW
  vet:
    classification: READONLY
  doc:
    classification: READONLY
  version:
    classification: READONLY
  env:
    classification: READONLY
  list:
    classification: READONLY

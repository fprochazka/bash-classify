# $schema: ../../../schemas/command.schema.json
command: uv
description: "An extremely fast Python package manager"
# An unrecognised subcommand is one this file does not model, not one uv refuses:
# uv installs, publishes and runs tools, and there is no reading of an unknown
# subcommand that makes it read-only.
classification: UNKNOWN
strict: false
global_options:
  -h: {overrides: READONLY}
  --version: {overrides: READONLY, before_subcommand_only: true}
  -V: {overrides: READONLY, before_subcommand_only: true}
  --help: {overrides: READONLY}
subcommands:
  run:
    classification: DANGEROUS
    strict: false
    delegates_to:
      mode: rest_are_argv
      strip_assignments: true
    # The options of `uv run` that take a value, the ones `uv run --help` hides included. Without them the matcher
    # reads the value as the program: uv runs `rm` in `uv run --only-group test rm -rf x`, but the matcher would
    # classify the command as the `test` builtin.
    # `--with`, `--with-editable` and `--with-requirements` install packages into the environment the command
    # runs in, and their executables come first on its PATH, so the word after them is not necessarily the
    # program that runs. Like `npx --package`, they are never delegated past.
    options:
      --allow-insecure-host: {takes_value: true, aliases: [--trusted-host]}
      --cache-dir: {takes_value: true}
      --color: {takes_value: true}
      --config-file: {takes_value: true}
      --config-setting: {takes_value: true, aliases: [-C, --config-settings]}
      --config-settings-package: {takes_value: true}
      --default-index: {takes_value: true}
      --directory: {takes_value: true}
      --env-file: {takes_value: true}
      --exclude-newer: {takes_value: true}
      --exclude-newer-package: {takes_value: true}
      --extra: {takes_value: true}
      --extra-index-url: {takes_value: true}
      --find-links: {takes_value: true, aliases: [-f]}
      --fork-strategy: {takes_value: true}
      --group: {takes_value: true}
      --index: {takes_value: true}
      --index-strategy: {takes_value: true}
      --index-url: {takes_value: true, aliases: [-i]}
      --keyring-provider: {takes_value: true}
      --link-mode: {takes_value: true}
      --max-recursion-depth: {takes_value: true}
      --no-binary-package: {takes_value: true}
      --no-build-isolation-package: {takes_value: true}
      --no-build-package: {takes_value: true}
      --no-editable-package: {takes_value: true}
      --no-extra: {takes_value: true}
      --no-group: {takes_value: true}
      --no-sources-package: {takes_value: true}
      --only-group: {takes_value: true}
      --package: {takes_value: true}
      --prerelease: {takes_value: true}
      --prerelease-package: {takes_value: true}
      --preview-features: {takes_value: true, aliases: [--preview-feature]}
      --project: {takes_value: true}
      --python: {takes_value: true, aliases: [-p]}
      --python-fetch: {takes_value: true}
      --python-platform: {takes_value: true}
      --python-preference: {takes_value: true}
      --refresh-package: {takes_value: true}
      --reinstall-package: {takes_value: true}
      --resolution: {takes_value: true}
      --upgrade-group: {takes_value: true}
      --upgrade-package: {takes_value: true, aliases: [-P]}
      --with: {takes_value: true, overrides: DANGEROUS, aliases: [-w]}
      --with-editable: {takes_value: true, overrides: DANGEROUS}
      --with-requirements: {takes_value: true, overrides: DANGEROUS}
    subcommands:
      pytest:
        classification: LOCAL_EFFECTS
        risk: LOW
        strict: false
      ruff:
        classification: LOCAL_EFFECTS
        risk: LOW
        strict: false
      mypy:
        classification: READONLY
        strict: false
  init:
    classification: LOCAL_EFFECTS
    risk: LOW
    strict: false
  add:
    classification: LOCAL_EFFECTS
    risk: LOW
    strict: false
    options:
      --dry-run: {overrides: READONLY}
  remove:
    classification: LOCAL_EFFECTS
    risk: LOW
    strict: false
    options:
      --dry-run: {overrides: READONLY}
  # bare `version` prints, but `version <bump>` rewrites the project file and can tag,
  # and one classification cannot be conditioned on an operand -- same call as `pnpm version`
  version:
    classification: LOCAL_EFFECTS
    strict: false
  sync:
    classification: LOCAL_EFFECTS
    risk: LOW
    strict: false
  lock:
    classification: LOCAL_EFFECTS
    risk: LOW
    strict: false
    options:
      --check: {overrides: READONLY}
  export:
    classification: READONLY
    strict: false
  tree:
    classification: READONLY
    strict: false
  format:
    classification: LOCAL_EFFECTS
    strict: false
  tool:
    classification: UNKNOWN
    strict: false
    subcommands:
      install:
        classification: LOCAL_EFFECTS
        risk: LOW
        strict: false
      uninstall:
        classification: LOCAL_EFFECTS
        risk: LOW
        strict: false
      list:
        classification: READONLY
      run:
        classification: DANGEROUS
        strict: false
      dir:
        classification: READONLY
  python:
    classification: UNKNOWN
    strict: false
    subcommands:
      install:
        classification: LOCAL_EFFECTS
        risk: LOW
        strict: false
      uninstall:
        classification: LOCAL_EFFECTS
        risk: LOW
        strict: false
      list:
        classification: READONLY
      find:
        classification: READONLY
        strict: false
      dir:
        classification: READONLY
      pin:
        classification: LOCAL_EFFECTS
        strict: false
  pip:
    classification: UNKNOWN
    strict: false
    subcommands:
      install:
        classification: LOCAL_EFFECTS
        risk: LOW
        strict: false
      uninstall:
        classification: LOCAL_EFFECTS
        risk: LOW
        strict: false
      list:
        classification: READONLY
        strict: false
      show:
        classification: READONLY
        strict: false
      freeze:
        classification: READONLY
      check:
        classification: READONLY
      compile:
        classification: LOCAL_EFFECTS
        strict: false
  venv:
    classification: LOCAL_EFFECTS
    risk: LOW
    strict: false
  build:
    classification: LOCAL_EFFECTS
    risk: LOW
    strict: false
  publish:
    classification: DANGEROUS
    strict: false
  cache:
    classification: UNKNOWN
    strict: false
    subcommands:
      clean:
        classification: LOCAL_EFFECTS
        risk: LOW
      prune:
        classification: LOCAL_EFFECTS
        risk: LOW
      dir:
        classification: READONLY
  self:
    classification: UNKNOWN
    strict: false
    subcommands:
      update:
        classification: LOCAL_EFFECTS
        risk: LOW
  help:
    classification: READONLY

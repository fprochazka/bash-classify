# $schema: ../../../schemas/command.schema.json
command: pip3
description: "Python package installer"
# An unrecognised subcommand is one this file does not model. pip installs and uninstalls
# packages, running their setup code, so an unknown subcommand is not read-only.
classification: UNKNOWN
strict: false
global_options:
  -h: {overrides: READONLY}
  --version: {overrides: READONLY, before_subcommand_only: true}
  -V: {overrides: READONLY, before_subcommand_only: true}
  --help: {overrides: READONLY}
subcommands:
  list:
    classification: READONLY
    strict: false
  show:
    classification: READONLY
    strict: false
  freeze:
    classification: READONLY
  search:
    classification: READONLY
  check:
    classification: READONLY
  install:
    classification: LOCAL_EFFECTS
    risk: LOW
    strict: false
  uninstall:
    classification: LOCAL_EFFECTS
    risk: LOW
    strict: false
  download:
    classification: EXTERNAL_EFFECTS
    strict: false
  wheel:
    classification: EXTERNAL_EFFECTS
    strict: false

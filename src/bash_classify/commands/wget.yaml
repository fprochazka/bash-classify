# $schema: ../../../schemas/command.schema.json
command: wget
description: "Non-interactive network file downloader"
classification: EXTERNAL_EFFECTS
strict: false
global_options:
  --help: {overrides: READONLY}
options:
  -O: {takes_value: true, names_output_path: true}
  --output-document: {takes_value: true, aliases: [-O], names_output_path: true}
  -P: {takes_value: true, captures_directory: true}
  --directory-prefix: {takes_value: true, aliases: [-P], captures_directory: true}

# $schema: ../../../schemas/command.schema.json
command: glab
description: "GitLab CLI"
classification: EXTERNAL_EFFECTS
strict: false
global_options:
  -R: {takes_value: true}
  --repo: {takes_value: true, aliases: [-R]}
  --help: {overrides: READONLY}
  -h: {overrides: READONLY, aliases: [--help]}

subcommands:
  # ── Core: Merge Requests ──────────────────────────────────────
  mr:
    classification: UNKNOWN
    subcommands:
      list:
        classification: READONLY
        strict: false
      view:
        classification: READONLY
        strict: false
        options:
          -c: {}
          --comments: {aliases: [-c]}
          -w: {}
          --web: {aliases: [-w]}
          -F: {takes_value: true}
          --output: {takes_value: true, aliases: [-F]}
          -P: {takes_value: true}
          --page: {takes_value: true, aliases: [-P]}
          -p: {takes_value: true}
          --per-page: {takes_value: true, aliases: [-p]}
      diff:
        classification: READONLY
        strict: false
      approvers:
        classification: READONLY
        strict: false
      issues:
        classification: READONLY
        strict: false
      create:
        classification: EXTERNAL_EFFECTS
        strict: false
      for:
        classification: EXTERNAL_EFFECTS
        strict: false
      update:
        classification: EXTERNAL_EFFECTS
        strict: false
      close:
        classification: EXTERNAL_EFFECTS
        strict: false
      reopen:
        classification: EXTERNAL_EFFECTS
        strict: false
      merge:
        classification: EXTERNAL_EFFECTS
        strict: false
      approve:
        classification: EXTERNAL_EFFECTS
        strict: false
      revoke:
        classification: EXTERNAL_EFFECTS
        strict: false
      rebase:
        classification: EXTERNAL_EFFECTS
        strict: false
      subscribe:
        classification: EXTERNAL_EFFECTS
        strict: false
      unsubscribe:
        classification: EXTERNAL_EFFECTS
        strict: false
      todo:
        classification: EXTERNAL_EFFECTS
        strict: false
      note:
        classification: EXTERNAL_EFFECTS
        strict: false
        options:
          -m: {takes_value: true}
          --message: {takes_value: true, aliases: [-m]}
        subcommands:
          list:
            classification: READONLY
            strict: false
            options:
              -F: {takes_value: true}
              --output: {takes_value: true, aliases: [-F]}
          resolve:
            classification: EXTERNAL_EFFECTS
            strict: false
          reopen:
            classification: EXTERNAL_EFFECTS
            strict: false
      checkout:
        classification: LOCAL_EFFECTS
        strict: false
      delete:
        classification: DANGEROUS
        strict: false

  # ── Core: Issues ──────────────────────────────────────────────
  issue:
    classification: UNKNOWN
    subcommands:
      list:
        classification: READONLY
        strict: false
      view:
        classification: READONLY
        strict: false
      create:
        classification: EXTERNAL_EFFECTS
        strict: false
      update:
        classification: EXTERNAL_EFFECTS
        strict: false
      close:
        classification: EXTERNAL_EFFECTS
        strict: false
      reopen:
        classification: EXTERNAL_EFFECTS
        strict: false
      note:
        classification: EXTERNAL_EFFECTS
        strict: false
      subscribe:
        classification: EXTERNAL_EFFECTS
        strict: false
      unsubscribe:
        classification: EXTERNAL_EFFECTS
        strict: false
      board:
        classification: UNKNOWN
        subcommands:
          view:
            classification: READONLY
            strict: false
          create:
            classification: EXTERNAL_EFFECTS
            strict: false
      delete:
        classification: DANGEROUS
        strict: false

  # ── Core: Incidents ───────────────────────────────────────────
  incident:
    classification: UNKNOWN
    subcommands:
      list:
        classification: READONLY
        strict: false
      view:
        classification: READONLY
        strict: false
      close:
        classification: EXTERNAL_EFFECTS
        strict: false
      reopen:
        classification: EXTERNAL_EFFECTS
        strict: false
      note:
        classification: EXTERNAL_EFFECTS
        strict: false
      subscribe:
        classification: EXTERNAL_EFFECTS
        strict: false
      unsubscribe:
        classification: EXTERNAL_EFFECTS
        strict: false

  # ── Core: Snippets ────────────────────────────────────────────
  snippet:
    classification: UNKNOWN
    subcommands:
      create:
        classification: EXTERNAL_EFFECTS
        strict: false

  # ── Core: Repositories ────────────────────────────────────────
  repo:
    classification: UNKNOWN
    subcommands:
      list:
        classification: READONLY
        strict: false
      view:
        classification: READONLY
        strict: false
      search:
        classification: READONLY
        strict: false
      contributors:
        classification: READONLY
        strict: false
      archive:
        classification: LOCAL_EFFECTS
        strict: false
      clone:
        classification: LOCAL_EFFECTS
        strict: false
      create:
        classification: EXTERNAL_EFFECTS
        strict: false
      update:
        classification: EXTERNAL_EFFECTS
        strict: false
      fork:
        classification: EXTERNAL_EFFECTS
        strict: false
      mirror:
        classification: EXTERNAL_EFFECTS
        strict: false
      transfer:
        classification: EXTERNAL_EFFECTS
        strict: false
      publish:
        classification: UNKNOWN
        subcommands:
          catalog:
            classification: EXTERNAL_EFFECTS
            strict: false
      members:
        classification: UNKNOWN
        subcommands:
          add:
            classification: EXTERNAL_EFFECTS
            strict: false
          remove:
            classification: EXTERNAL_EFFECTS
            strict: false
      delete:
        classification: DANGEROUS
        strict: false

  # ── Core: Releases ────────────────────────────────────────────
  release:
    classification: UNKNOWN
    subcommands:
      list:
        classification: READONLY
        strict: false
      view:
        classification: READONLY
        strict: false
      create:
        classification: EXTERNAL_EFFECTS
        strict: false
      upload:
        classification: EXTERNAL_EFFECTS
        strict: false
      download:
        classification: LOCAL_EFFECTS
        strict: false
      delete:
        classification: DANGEROUS
        strict: false

  # ── CI/CD: Pipelines ──────────────────────────────────────────
  ci:
    classification: UNKNOWN
    # `pipe` and `pipeline` are glab's own deprecated aliases for `ci`
    aliases: [pipe, pipeline]
    subcommands:
      list:
        classification: READONLY
        strict: false
        options:
          -b: {takes_value: true}
          --branch: {takes_value: true, aliases: [-b]}
          -P: {takes_value: true}
          --page: {takes_value: true, aliases: [-P]}
          --per-page: {takes_value: true}
          --status: {takes_value: true}
          -F: {takes_value: true}
          --output: {takes_value: true, aliases: [-F]}
      status:
        classification: READONLY
        strict: false
        options:
          -b: {takes_value: true}
          --branch: {takes_value: true, aliases: [-b]}
          --compact: {}
          --pipeline-id: {takes_value: true}
      view:
        classification: READONLY
        strict: false
        options:
          -b: {takes_value: true}
          --branch: {takes_value: true, aliases: [-b]}
          -w: {}
          --web: {aliases: [-w]}
      get:
        classification: READONLY
        strict: false
        options:
          -b: {takes_value: true}
          --branch: {takes_value: true, aliases: [-b]}
          -p: {takes_value: true}
          --pipeline: {takes_value: true, aliases: [-p]}
          -F: {takes_value: true}
          --output: {takes_value: true, aliases: [-F]}
          --with-job-details: {}
      trace:
        classification: READONLY
        strict: false
        options:
          -b: {takes_value: true}
          --branch: {takes_value: true, aliases: [-b]}
          -p: {takes_value: true}
          --pipeline-id: {takes_value: true, aliases: [-p]}
      lint:
        classification: READONLY
        strict: false
      config:
        classification: UNKNOWN
        subcommands:
          compile:
            classification: READONLY
            strict: false
      artifact:
        classification: LOCAL_EFFECTS
        strict: false
      run:
        classification: EXTERNAL_EFFECTS
        strict: false
      run-trig:
        classification: EXTERNAL_EFFECTS
        strict: false
      trigger:
        classification: EXTERNAL_EFFECTS
        strict: false
      retry:
        classification: EXTERNAL_EFFECTS
        strict: false
      cancel:
        classification: EXTERNAL_EFFECTS
        strict: false
      delete:
        classification: DANGEROUS
        strict: false

  # ── CI/CD: Jobs ────────────────────────────────────────────────
  job:
    classification: UNKNOWN
    subcommands:
      artifact:
        classification: LOCAL_EFFECTS
        strict: false

  # ── CI/CD: Schedules ──────────────────────────────────────────
  schedule:
    classification: UNKNOWN
    subcommands:
      list:
        classification: READONLY
        strict: false
      create:
        classification: EXTERNAL_EFFECTS
        strict: false
      update:
        classification: EXTERNAL_EFFECTS
        strict: false
      run:
        classification: EXTERNAL_EFFECTS
        strict: false
      delete:
        classification: DANGEROUS
        strict: false

  # ── CI/CD: Runners ────────────────────────────────────────────
  runner:
    classification: UNKNOWN
    subcommands:
      list:
        classification: READONLY
        strict: false
      jobs:
        classification: READONLY

# $schema: ../../../schemas/command.schema.json
command: ruff
description: "Fast Python linter and formatter"
# An unrecognised subcommand is one this file does not model. `ruff clean` deletes caches
# and `ruff format` rewrites files, so an unknown subcommand is not read-only by default.
classification: UNKNOWN
strict: false
global_options:
  --help: {overrides: READONLY}
  -h: {overrides: READONLY, aliases: [--help]}
subcommands:
  check:
    classification: READONLY
    strict: false
    options:
      --fix: {overrides: LOCAL_EFFECTS, risk: LOW}
      --fix-only: {overrides: LOCAL_EFFECTS, risk: LOW}
  format:
    classification: LOCAL_EFFECTS
    risk: LOW
    strict: false
    options:
      --check: {overrides: READONLY}
      --diff: {overrides: READONLY}
  version:
    classification: READONLY
  rule:
    classification: READONLY
  linter:
    classification: READONLY
  clean:
    classification: LOCAL_EFFECTS
    risk: LOW
